<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b1f4e">
<title>Campo de Flores Amarillas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:ital,wght@0,400;0,600;1,400&display=swap">
<style>
  :root{
    --fondo:#1a1230; --oro:#f5c451; --oro-2:#c98a1a; --crema:#fff3d6; --texto:#f2e9d6; --papel:#fff6dc; --tinta:#4a3210;
    --manuscrita:'Caveat','Segoe Script','Bradley Hand',cursive; --cuerpo:'Nunito','Segoe UI',system-ui,sans-serif;
    padding:0;
  }
  html,body{height:100%;margin:0}
  [hidden]{display:none!important}
  body{background:var(--fondo);color:var(--texto);font-family:var(--cuerpo);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
  #escena{position:fixed;inset:0;overflow:hidden;background:var(--fondo)}
  .capa{position:absolute;inset:0}
  canvas{display:block;touch-action:none}
  .manuscrita{font-family:var(--manuscrita);font-weight:700;color:var(--oro);text-shadow:0 0 18px rgba(245,196,81,.45),0 2px 6px rgba(0,0,0,.6)}
  .eyebrow{margin:0;font-size:.74rem;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,243,214,.8);text-shadow:0 1px 4px rgba(0,0,0,.5)}

  /* ---- portada ---- */
  #portada{display:flex;flex-direction:column;align-items:center;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 7vh) 20px 0;pointer-events:none;transition:opacity 1.6s ease}
  #portada.fuera{opacity:0}
  #portada h1{margin:.15em 0 0;font-size:clamp(2.6rem,11vw,4.4rem);line-height:1.05;text-wrap:balance}
  #toque{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 7vh);margin:0;font-size:.8rem;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,243,214,.85);text-shadow:0 1px 6px rgba(0,0,0,.7);animation:latir 2.2s ease-in-out infinite}
  @keyframes latir{0%,100%{opacity:.45}50%{opacity:1}}
  #pista{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 14px);margin:0;padding:0 58px;text-align:center;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,243,214,.7);text-shadow:0 1px 6px rgba(0,0,0,.7);pointer-events:none;opacity:0;transition:opacity 1.2s}
  #pista.ver{opacity:1}
  #btnSeguir{position:absolute;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 2.6vh);z-index:4;font:600 .82rem var(--cuerpo);letter-spacing:.05em;color:var(--oro);background:rgba(10,8,24,.55);border:1.5px solid var(--oro-2);border-radius:999px;padding:.55em 1.1em;cursor:pointer;opacity:0;transition:opacity 1s;box-shadow:0 0 18px rgba(245,196,81,.25);backdrop-filter:blur(4px)}
  #btnSeguir.ver{opacity:1}
  #btnSeguir:focus-visible{outline:2px solid var(--oro);outline-offset:3px}

  /* ---- notita grande ---- */
  #nota{display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(6,4,18,0);transition:background .4s;cursor:pointer}
  #nota.abierta{background:rgba(6,4,18,.5)}
  .papel{position:relative;width:min(84vw,360px);box-sizing:border-box;padding:38px 26px 30px;background:linear-gradient(180deg,#fffaea,#fff1cf);color:var(--tinta);border-radius:6px;box-shadow:0 24px 50px rgba(0,0,0,.55),0 0 0 1px rgba(120,80,20,.15);transform:rotate(-2.5deg) scale(.8);opacity:0;transition:transform .5s cubic-bezier(.2,.9,.3,1.25),opacity .4s;text-align:center}
  #nota.abierta .papel{transform:rotate(-2deg) scale(1);opacity:1}
  .papel::before{content:"";position:absolute;left:50%;top:-14px;width:22px;height:34px;margin-left:-11px;background:linear-gradient(90deg,#c9915a,#a86f3c);border-radius:4px;box-shadow:0 3px 6px rgba(0,0,0,.35)}
  .papel p{margin:0;font-family:var(--manuscrita);font-weight:700;font-size:clamp(1.9rem,8vw,2.6rem);line-height:1.15;color:var(--tinta);text-shadow:none}
  .papel small{display:block;margin-top:1.1em;font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(74,50,16,.55)}

  /* ---- tarjetas ---- */
  #tarjeta{display:flex;align-items:center;justify-content:center;padding:24px 16px;background:rgba(6,4,18,0);transition:background .5s}
  #tarjeta.abierta{background:rgba(6,4,18,.55)}
  .carta{width:min(88vw,380px);max-height:calc(100% - 24px);overflow:auto;box-sizing:border-box;padding:22px 22px 20px;text-align:center;background:linear-gradient(180deg,rgba(24,16,8,.94),rgba(14,10,4,.96));border:1.5px solid var(--oro-2);border-radius:20px;box-shadow:0 0 0 1px rgba(245,196,81,.15) inset,0 0 40px rgba(245,196,81,.22),0 20px 50px rgba(0,0,0,.6);transform:scale(.86) translateY(14px);opacity:0;transition:transform .55s cubic-bezier(.2,.9,.3,1.2),opacity .45s}
  #tarjeta.abierta .carta{transform:none;opacity:1}
  .ramo{height:min(38vh,210px);display:flex;justify-content:center}
  .ramo svg{height:100%;width:auto;max-width:100%;filter:drop-shadow(0 8px 16px rgba(0,0,0,.5))}
  .carta h2{margin:.35em 0 .25em;font-size:2.35rem;line-height:1}
  .carta p{margin:0 auto;max-width:30ch;font-size:1.05rem;line-height:1.55;color:var(--crema)}
  .carta .paso{margin-top:.9em;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,243,214,.5)}
  .boton{font:600 .95rem var(--cuerpo);letter-spacing:.05em;color:var(--oro);background:transparent;border:1.5px solid var(--oro-2);border-radius:999px;padding:.6em 1.6em;margin-top:1.1em;cursor:pointer}
  .boton:hover{background:rgba(245,196,81,.12)}
  .boton:focus-visible{outline:2px solid var(--oro);outline-offset:3px}

  /* ---- final: una carta de papel colgada, con sello y firma ---- */
  #final{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:calc(env(safe-area-inset-top,0px) + 24px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);pointer-events:none}
  .carta-final{position:relative;width:min(86vw,380px);box-sizing:border-box;padding:34px 26px 24px;color:var(--tinta);border-radius:5px;
    background:repeating-linear-gradient(transparent 0 29px,rgba(120,80,20,.13) 29px 30px),linear-gradient(180deg,#fffaea,#fff0cc);background-origin:content-box,border-box;
    box-shadow:0 26px 60px rgba(0,0,0,.5),0 0 0 1px rgba(120,80,20,.18);transform:rotate(-7deg) translateY(50px) scale(.88);opacity:0;transition:transform 1.3s cubic-bezier(.2,.9,.3,1.15),opacity .9s;pointer-events:auto}
  #final.ver .carta-final{transform:rotate(-1.5deg);opacity:1}
  .carta-final::before{content:"";position:absolute;left:50%;top:-16px;width:24px;height:38px;margin-left:-12px;background:linear-gradient(90deg,#c9915a,#a86f3c);border-radius:4px;box-shadow:0 3px 6px rgba(0,0,0,.35)}
  .sello{position:absolute;top:-12px;right:-14px;transform:rotate(9deg);max-width:60%;text-align:center;border:2px dashed var(--oro-2);color:#a8700f;border-radius:999px;padding:.4em .9em;
    font:700 .6rem var(--cuerpo);letter-spacing:.16em;text-transform:uppercase;background:rgba(255,246,220,.95);box-shadow:0 4px 10px rgba(0,0,0,.2)}
  .saludo{margin:0 0 .1em;font-family:var(--manuscrita);font-weight:700;font-size:2.1rem;line-height:1.25;color:var(--tinta);text-align:left}
  .cuerpo{margin:0;font-family:var(--manuscrita);font-weight:500;font-size:1.5rem;line-height:1.25;color:var(--tinta);text-align:left;text-wrap:pretty}
  .despedida{margin:.55em 0 0;font-family:var(--manuscrita);font-weight:700;font-size:1.85rem;line-height:1.2;color:#9a6410;text-align:right}
  .florcita{position:absolute;left:-16px;bottom:-14px;width:58px;height:58px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3));transform:rotate(-14deg)}
  #otraVez{font:600 .9rem var(--cuerpo);letter-spacing:.06em;color:#fff;background:rgba(40,28,10,.42);border:1.5px solid rgba(255,255,255,.75);border-radius:999px;padding:.6em 1.5em;cursor:pointer;backdrop-filter:blur(4px);opacity:0;transition:opacity 1s .8s;pointer-events:auto}
  #final.ver #otraVez{opacity:1}
  #otraVez:focus-visible{outline:2px solid #fff;outline-offset:3px}

  #sonido{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;z-index:5;width:38px;height:38px;font:1.2rem var(--cuerpo);line-height:1;color:var(--crema);background:rgba(10,8,24,.45);border:1px solid rgba(255,243,214,.35);border-radius:50%;padding:0;cursor:pointer}
  #sonido[aria-pressed="false"]{color:rgba(255,243,214,.4);text-decoration:line-through}
  #sonido:focus-visible{outline:2px solid var(--oro)}

  @media (prefers-reduced-motion:reduce){ #toque{animation:none} }
</style>
</head>
<body>
<div id="escena">
  <canvas id="lienzo" class="capa"></canvas>

  <div id="portada" class="capa">
    <p class="eyebrow"></p>
    <h1 class="manuscrita"></h1>
    <p id="toque">Toca la pantalla</p>
  </div>
  <p id="pista">Desliza para ver más notitas · toca una para leerla</p>
  <button id="btnSeguir" type="button" hidden>Continuar &#10022;</button>

  <div id="nota" class="capa" hidden>
    <div class="papel"><p id="notaTxt"></p><small>Toca para cerrar</small></div>
  </div>

  <div id="tarjeta" class="capa" hidden>
    <div class="carta" role="dialog" aria-labelledby="tituloTarjeta">
      <div class="ramo" id="ramo"></div>
      <h2 class="manuscrita" id="tituloTarjeta"></h2>
      <p id="textoTarjeta"></p>
      <p class="paso" id="pasoTarjeta"></p>
      <button class="boton" id="cerrar" type="button">Cerrar</button>
    </div>
  </div>

  <div id="final" class="capa" hidden>
    <div class="carta-final">
      <span class="sello"></span>
      <p class="saludo"></p>
      <p class="cuerpo"></p>
      <p class="despedida"></p>
      <svg class="florcita" viewBox="0 0 100 100" aria-hidden="true">
        <g id="petalo"><ellipse cx="50" cy="17" rx="8" ry="17" fill="#f5c451"/></g>
        <use href="#petalo" transform="rotate(30 50 50)"/><use href="#petalo" transform="rotate(60 50 50)"/><use href="#petalo" transform="rotate(90 50 50)"/><use href="#petalo" transform="rotate(120 50 50)"/><use href="#petalo" transform="rotate(150 50 50)"/><use href="#petalo" transform="rotate(180 50 50)"/><use href="#petalo" transform="rotate(210 50 50)"/><use href="#petalo" transform="rotate(240 50 50)"/><use href="#petalo" transform="rotate(270 50 50)"/><use href="#petalo" transform="rotate(300 50 50)"/><use href="#petalo" transform="rotate(330 50 50)"/>
        <circle cx="50" cy="50" r="17" fill="#6b3a12"/><circle cx="50" cy="50" r="12" fill="#3f2108"/>
      </svg>
    </div>
    <button id="otraVez" type="button">Ver de nuevo</button>
  </div>

  <button id="sonido" type="button" aria-pressed="true" aria-label="Sonido activado" title="Sonido" hidden>&#9834;</button>
  <audio id="cancion" src="cancion.mp3" loop preload="auto"></audio>
</div>

<script id="datos" type="application/json">{"para": "Valeria", "fecha": "21 de septiembre", "ocasion": "Feliz Día de las Flores Amarillas", "frases": ["Eres mi sol|de cada día", "Gracias por ser|mi lugar seguro", "Que nunca dejes|de brillar", "Una flor amarilla|por cada sonrisa tuya"], "tarjetas": [{"ramo": "girasoles", "titulo": "Un sol para ti", "texto": "Porque iluminas cada día con tu forma de ser."}, {"ramo": "tulipanes", "titulo": "Que florezcas", "texto": "Que todo lo que sueñas encuentre su primavera."}], "mensaje": "Que hoy te lleguen muchas flores amarillas y que nunca te falten motivos para sonreír.", "firma": "Con cariño, Roberto"}</script>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const escena = $('#escena'), cv = $('#lienzo'), portada = $('#portada'), pista = $('#pista'), btnSeguir = $('#btnSeguir');
  const nota = $('#nota'), tarjeta = $('#tarjeta'), fin = $('#final'), cancion = $('#cancion'), sonidoBtn = $('#sonido');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const DPR = Math.min(devicePixelRatio || 1, 2);
  const TAU = Math.PI * 2;
  const clamp = v => v < 0 ? 0 : v > 1 ? 1 : v;
  const smooth = v => { v = clamp(v); return v * v * (3 - 2 * v); };
  const paso = (a, b, v) => smooth((v - a) / (b - a));
  const mezcla = (a, b, k) => a + (b - a) * k;

  // ---------- contenido: viene del bloque #datos (el Taller puede pasar otro en el #hash) ----------
  function leerDatos() {
    let d = {};
    try { d = JSON.parse(document.getElementById('datos').textContent); } catch (e) {}
    try {
      const h = location.hash.slice(1);
      if (h.slice(0, 6) === 'datos=') d = Object.assign({}, d, JSON.parse(decodeURIComponent(h.slice(6))));
    } catch (e) {}
    return d;
  }
  const DATOS = leerDatos();
  const FRASES = DATOS.frases, TARJETAS = DATOS.tarjetas;
  document.title = 'Flores amarillas para ' + DATOS.para;
  $('#portada .eyebrow').textContent = DATOS.fecha;
  $('#portada h1').textContent = 'Para ' + DATOS.para;
  $('#final .sello').textContent = DATOS.ocasion;
  $('#final .saludo').textContent = 'Para ' + DATOS.para + ',';
  $('#final .cuerpo').textContent = DATOS.mensaje;
  $('#final .despedida').textContent = DATOS.firma;

  // ---------- estado ----------
  let W = 0, H = 0, c, t0 = performance.now(), ultimo = 0;
  let estado = 'portada';          // portada → ocaso → noche → alba → fin
  let T = 0, tFase = 0;            // T: 0 atardecer · 1 noche · 2 amanecer
  let pan = 0, panMax = 0, notasA = 0;
  const leidos = new Set();
  let fuentesOK = false;
  if (document.fonts && document.fonts.load) document.fonts.load('700 20px Caveat').then(() => { fuentesOK = true; }).catch(() => {});

  // ---------- utilidades ----------
  let semilla = 7;
  const rnd = () => { semilla = (semilla * 1664525 + 1013904223) >>> 0; return semilla / 4294967296; };
  const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const rgb = (a, b, k) => `rgb(${Math.round(mezcla(a[0], b[0], k))},${Math.round(mezcla(a[1], b[1], k))},${Math.round(mezcla(a[2], b[2], k))})`;
  const rgba = (col, a) => `rgba(${col[0]},${col[1]},${col[2]},${a.toFixed(3)})`;
  function envolver(texto, maxW) {
    if (texto.indexOf('|') >= 0) return texto.split('|').map(s => s.trim());
    const palabras = texto.split(' '), lineas = []; let linea = '';
    for (const p of palabras) {
      const prueba = linea ? linea + ' ' + p : p;
      if (c.measureText(prueba).width > maxW && linea) { lineas.push(linea); linea = p; } else linea = prueba;
    }
    if (linea) lineas.push(linea);
    return lineas;
  }

  // ---------- cielo por hora ----------
  const CIELO = [
    { t: 0,   top: '#3b2a63', mid: '#e0603a', hz: '#ffc46b', sueloA: '#55601f', sueloB: '#1c2611', luz: 1 },
    { t: 0.5, top: '#150f33', mid: '#5c2b5e', hz: '#c85a4a', sueloA: '#2c3418', sueloB: '#10160a', luz: 0.55 },
    { t: 1,   top: '#040716', mid: '#0a1033', hz: '#152045', sueloA: '#151d10', sueloB: '#070b05', luz: 0.18 },
    { t: 1.5, top: '#1b1a48', mid: '#7a4070', hz: '#f08a5a', sueloA: '#2c3418', sueloB: '#10160a', luz: 0.55 },
    { t: 2,   top: '#4f9be0', mid: '#f5b57a', hz: '#fff0b8', sueloA: '#5e6c28', sueloB: '#25321a', luz: 1 }
  ].map(k => ({ t: k.t, top: hex(k.top), mid: hex(k.mid), hz: hex(k.hz), sueloA: hex(k.sueloA), sueloB: hex(k.sueloB), luz: k.luz }));
  function cielo(T) {
    let i = 0; while (i < CIELO.length - 2 && T > CIELO[i + 1].t) i++;
    const a = CIELO[i], b = CIELO[i + 1], k = smooth((T - a.t) / (b.t - a.t));
    return { top: rgb(a.top, b.top, k), mid: rgb(a.mid, b.mid, k), hz: rgb(a.hz, b.hz, k), sueloA: rgb(a.sueloA, b.sueloA, k), sueloB: rgb(a.sueloB, b.sueloB, k), luz: mezcla(a.luz, b.luz, k) };
  }
  const nocturno = T => paso(0.45, 0.95, T) * (1 - paso(1.15, 1.6, T));

  // ---------- girasoles (sprites) ----------
  const SPRITES = {};
  function hoja(cx, cy, dir, l) {
    c.save(); c.translate(cx, cy); c.rotate(dir * (0.9 + rnd() * 0.4));
    const g = c.createLinearGradient(0, 0, l, 0); g.addColorStop(0, '#2f6b2a'); g.addColorStop(1, '#4f9a3c');
    c.fillStyle = g; c.beginPath(); c.ellipse(l * 0.55, 0, l * 0.55, l * 0.24, 0, 0, TAU); c.fill();
    c.strokeStyle = 'rgba(20,60,20,.5)'; c.lineWidth = 1; c.beginPath(); c.moveTo(0, 0); c.lineTo(l, 0); c.stroke();
    c.restore();
  }
  function spriteGirasol(h, variante) {
    const w = Math.round(h * 0.62), s = document.createElement('canvas');
    s.width = Math.round(w * DPR); s.height = Math.round(h * DPR);
    const prev = c; c = s.getContext('2d'); c.scale(DPR, DPR);
    semilla = 11 + variante * 97 + Math.round(h);
    const R = h * 0.19, cx = w / 2, cy = R * 1.08;
    // tallo
    c.strokeStyle = '#3a6b2a'; c.lineWidth = Math.max(2, h * 0.026); c.lineCap = 'round';
    c.beginPath(); c.moveTo(cx, h); c.quadraticCurveTo(cx + (rnd() - 0.5) * h * 0.12, h * 0.55, cx, cy + R * 0.25); c.stroke();
    hoja(cx, h * 0.62, 1, h * 0.17); hoja(cx, h * 0.76, -1, h * 0.15); hoja(cx, h * 0.5, -1, h * 0.13);
    // pétalos: capa trasera oscura y capa delantera clara
    const capas = [{ n: 17, r: 0.60, len: 0.44, wid: 0.15, a: '#d98a12', b: '#f5b93a', off: 0.5 }, { n: 17, r: 0.56, len: 0.42, wid: 0.14, a: '#f0b52a', b: '#ffe36a', off: 0 }];
    for (const L of capas) for (let i = 0; i < L.n; i++) {
      c.save(); c.translate(cx, cy); c.rotate((i + L.off) * TAU / L.n + (rnd() - 0.5) * 0.08);
      const g = c.createLinearGradient(R * 0.2, 0, R * (L.r + L.len), 0); g.addColorStop(0, L.a); g.addColorStop(1, L.b);
      c.fillStyle = g; c.beginPath(); c.ellipse(R * L.r, 0, R * L.len * (0.9 + rnd() * 0.2), R * L.wid, 0, 0, TAU); c.fill();
      c.restore();
    }
    // disco central
    const rc = R * 0.36, g = c.createRadialGradient(cx - rc * 0.2, cy - rc * 0.2, rc * 0.1, cx, cy, rc);
    g.addColorStop(0, '#7a4a1c'); g.addColorStop(0.7, '#3d2108'); g.addColorStop(1, '#22120a');
    c.fillStyle = g; c.beginPath(); c.arc(cx, cy, rc, 0, TAU); c.fill();
    const n = h > 120 ? 90 : 36;
    for (let i = 0; i < n; i++) { const a = i * 2.39996, rr = rc * 0.92 * Math.sqrt(i / n); c.fillStyle = i % 2 ? 'rgba(255,200,90,.35)' : 'rgba(0,0,0,.35)'; c.beginPath(); c.arc(cx + rr * Math.cos(a), cy + rr * Math.sin(a), rc * 0.06, 0, TAU); c.fill(); }
    c = prev; return { cv: s, w, h };
  }
  const FILAS = [
    { n: 24, h: 0.15, y0: 0.70, y1: 0.745, par: 0.12, tag: 'lejos' },
    { n: 12, h: 0.30, y0: 0.93, y1: 0.97, par: 0.25, tag: 'medio' },
    { n: 7,  h: 0.42, y0: 1.11, y1: 1.15, par: 0.45, tag: 'cerca' }
  ];
  let flores = [];
  function initCampo() {
    flores = [];
    FILAS.forEach((F, fi) => {
      const h = F.h * H;
      SPRITES[F.tag] = [0, 1, 2].map(v => spriteGirasol(h, v + fi * 3));
      semilla = 300 + fi;
      const ancho = 1.3 * W + panMax * F.par;
      for (let i = 0; i < F.n; i++) {
        const x = -0.15 * W + (i + 0.15 + rnd() * 0.7) / F.n * ancho;
        flores.push({ fila: fi, x, y: (F.y0 + rnd() * (F.y1 - F.y0)) * H, sp: SPRITES[F.tag][Math.floor(rnd() * 3)], esc: 0.85 + rnd() * 0.3, ph: rnd() * TAU, par: F.par });
      }
    });
    flores.sort((a, b) => a.fila - b.fila || a.y - b.y);
  }

  // ---------- notitas en el tendedero ----------
  let items = [], notaW = 0, notaH = 0, pasoX = 0;
  function initNotas() {
    notaW = Math.min(W * 0.30, 168); notaH = notaW * 0.72; pasoX = notaW * 1.32;
    items = [];
    // las frases se reparten en dos cuerdas y cada tarjeta va al medio de una (con 4 frases: f0 T0 f1 · f2 T1 f3)
    const mitad = Math.ceil(FRASES.length / 2);
    const fila1 = FRASES.slice(0, mitad).map((_, i) => ['f', i]), fila2 = FRASES.slice(mitad).map((_, i) => ['f', mitad + i]);
    fila1.splice(Math.ceil(fila1.length / 2), 0, ['t', 0]); fila2.splice(Math.ceil(fila2.length / 2), 0, ['t', 1]);
    const filas = [{ y: 0.19, lista: fila1 }, { y: 0.415, lista: fila2 }];
    semilla = 500;
    filas.forEach((F, fi) => {
      const ancho = (F.lista.length - 1) * pasoX + notaW * 1.18;
      const x0 = ancho + 0.2 * W <= W ? (W - ancho) / 2 + notaW * 0.59 : 0.22 * W + (fi ? pasoX * 0.5 : 0);
      F.lista.forEach((o, i) => {
        const x = x0 + i * pasoX;
        items.push({ tipo: o[0], idx: o[1], id: o[0] + o[1], fila: fi, x, yLinea: F.y * H, ph: rnd() * TAU, rot: (rnd() - 0.5) * 0.09 });
      });
    });
    const ultimo = Math.max(...items.map(it => it.x)) + notaW * 0.5 + 0.16 * W;

  }
  function yTendedero(x, yBase) { return yBase + Math.sin(x / (pasoX * 2) * Math.PI) ** 2 * notaH * 0.16; }   // la cuerda cuelga entre postes

  // ---------- estrellas, luciérnagas, pétalos ----------
  let estrellas = [], lucis = [], petalos = [];
  function initParticulas() {
    semilla = 900;
    estrellas = Array.from({ length: reduce ? 70 : 140 }, () => ({ x: rnd(), y: rnd() * 0.52, s: 0.6 + Math.pow(rnd(), 1.5) * 2.2, ph: rnd() * TAU, f: 0.6 + rnd() * 1.6 }));
    lucis = Array.from({ length: reduce ? 14 : 34 }, () => ({ x: rnd() * W, y: (0.5 + rnd() * 0.45) * H, vx: 0, vy: 0, ph: rnd() * TAU, f: 0.5 + rnd() * 1.2, s: 1.4 + rnd() * 1.6 }));

  }
  function estrella(x, y, s, a) {
    c.fillStyle = `rgba(230,236,255,${a.toFixed(3)})`; c.fillRect(x - s / 2, y - s / 2, s, s);

    const L = s * (1.5 + 4 * a);

    c.beginPath(); c.moveTo(x - L, y); c.lineTo(x + L, y); c.moveTo(x, y - L); c.lineTo(x, y + L); c.stroke();
  }

  // ---------- dibujo ----------
  function viento(t, x) { return Math.sin(t * 0.9 - x * 0.0035) * 0.6 + Math.sin(t * 2.1 - x * 0.006) * 0.25 + Math.sin(t * 0.23) * 0.5; }
  function draw(t, dt) {
    const K = cielo(T), hz = 0.56 * H, noche = nocturno(T);
    // cielo
    let g = c.createLinearGradient(0, 0, 0, hz);
    g.addColorStop(0, K.top); g.addColorStop(0.62, K.mid); g.addColorStop(1, K.hz);
    c.fillStyle = g; c.fillRect(0, 0, W, hz + 2);
    // estrellas
    if (noche > 0.01) for (const e of estrellas) {
      const a = noche * (0.35 + 0.65 * Math.abs(Math.sin(t * e.f + e.ph)));
      estrella(e.x * W, e.y * H, e.s * (W > 700 ? 1.2 : 1), a);
    }
    // sol
    const rs = 0.11 * Math.min(W, H);
    let sol = null;
    if (T < 0.75) sol = { x: 0.7 * W, y: hz - 0.10 * H + paso(0, 0.62, T) * 0.19 * H, a: 1 - paso(0.55, 0.75, T) };
    else if (T > 1.35) sol = { x: 0.32 * W, y: hz + 0.09 * H - paso(1.45, 2, T) * 0.27 * H, a: paso(1.35, 1.55, T) };
    if (sol && sol.a > 0) {
      g = c.createRadialGradient(sol.x, sol.y, rs * 0.4, sol.x, sol.y, rs * 5);
      g.addColorStop(0, `rgba(255,190,90,${(0.55 * sol.a).toFixed(3)})`); g.addColorStop(0.35, `rgba(255,140,70,${(0.22 * sol.a).toFixed(3)})`); g.addColorStop(1, 'rgba(255,120,60,0)');
      c.fillStyle = g; c.fillRect(0, 0, W, hz + 2);
      g = c.createRadialGradient(sol.x, sol.y, 0, sol.x, sol.y, rs);
      g.addColorStop(0, '#fff2b0'); g.addColorStop(0.8, '#ffd36a'); g.addColorStop(1, 'rgba(255,200,90,0.85)');
      c.save(); c.beginPath(); c.rect(0, 0, W, hz + 1); c.clip();
      c.globalAlpha = sol.a; c.fillStyle = g; c.beginPath(); c.arc(sol.x, sol.y, rs, 0, TAU); c.fill(); c.restore();
    }
    // luna (pequeña)
    if (T > 0.5 && T < 1.5) {
      const k = paso(0.5, 1, T), k2 = paso(1.05, 1.5, T);
      const lx = mezcla(0.82, 0.55, k) * W - k2 * 0.2 * W, ly = mezcla(hz - 0.02 * H, 0.15 * H, k) + k2 * 0.25 * H, rl = 0.034 * Math.min(W, H), a = noche;
      g = c.createRadialGradient(lx, ly, rl, lx, ly, rl * 4); g.addColorStop(0, `rgba(240,240,255,${(0.28 * a).toFixed(3)})`); g.addColorStop(1, 'rgba(240,240,255,0)');
      c.fillStyle = g; c.fillRect(lx - rl * 4, ly - rl * 4, rl * 8, rl * 8);
      c.globalAlpha = a; c.fillStyle = '#f4f1e0'; c.beginPath(); c.arc(lx, ly, rl, 0, TAU); c.fill();
      c.fillStyle = 'rgba(180,180,200,.35)'; c.beginPath(); c.arc(lx - rl * 0.3, ly - rl * 0.2, rl * 0.28, 0, TAU); c.arc(lx + rl * 0.35, ly + rl * 0.3, rl * 0.2, 0, TAU); c.fill();
      c.globalAlpha = 1;
    }
    // lomas lejanas y suelo
    c.fillStyle = K.sueloA;
    c.beginPath(); c.moveTo(0, hz);
    for (let x = 0; x <= W; x += 8) c.lineTo(x, hz - (Math.sin(x * 0.004 + 1) * 0.5 + Math.sin(x * 0.011) * 0.3 + 0.8) * 0.02 * H);
    c.lineTo(W, H); c.lineTo(0, H); c.closePath(); c.fill();
    g = c.createLinearGradient(0, hz, 0, H); g.addColorStop(0, K.sueloA); g.addColorStop(1, K.sueloB);
    c.fillStyle = g; c.fillRect(0, hz, W, H - hz);
    // girasoles
    const amp = reduce ? 0 : 0.035;
    for (const f of flores) {
      const x = f.x + pan * f.par, w = f.sp.w * f.esc, h = f.sp.h * f.esc;
      if (x < -w || x > W + w) continue;
      c.save(); c.translate(x, f.y); c.rotate(amp * viento(t, f.x) + amp * 0.4 * Math.sin(t * 1.3 + f.ph));
      c.drawImage(f.sp.cv, -w / 2, -h, w, h); c.restore();
    }
    // luz: cálida al atardecer/amanecer, azul de noche sobre el campo
    if (K.luz < 0.99) { c.fillStyle = `rgba(6,10,36,${((1 - K.luz) * 0.62).toFixed(3)})`; c.fillRect(0, hz - 0.03 * H, W, H); }
    if (sol && sol.a > 0.02) { c.globalCompositeOperation = 'lighter'; c.fillStyle = `rgba(255,120,40,${(0.10 * sol.a * (T < 1 ? 1 - paso(0.3, 0.6, T) : paso(1.5, 1.8, T))).toFixed(3)})`; c.fillRect(0, hz - 0.03 * H, W, H); c.globalCompositeOperation = 'source-over'; }
    // tendedero con notitas
    if (notasA > 0.005) drawNotas(t, noche);
    // luciérnagas
    if (noche > 0.02 && !nota.classList.contains('abierta')) {
      c.globalCompositeOperation = 'lighter';
      for (const l of lucis) {
        l.vx += (Math.random() - 0.5) * 6 * dt; l.vy += (Math.random() - 0.5) * 5 * dt;
        l.vx *= 0.96; l.vy *= 0.96; l.x += l.vx; l.y += l.vy;
        if (l.x < -20) l.x = W + 20; if (l.x > W + 20) l.x = -20;
        if (l.y < 0.45 * H) l.vy += 0.3 * dt; if (l.y > 0.97 * H) l.vy -= 0.3 * dt;
        const b = Math.max(0, Math.sin(t * l.f + l.ph)) ** 3 * noche;
        if (b < 0.02) continue;
        g = c.createRadialGradient(l.x, l.y, 0, l.x, l.y, l.s * 6);
        g.addColorStop(0, `rgba(225,255,140,${(0.9 * b).toFixed(3)})`); g.addColorStop(0.25, `rgba(200,255,120,${(0.35 * b).toFixed(3)})`); g.addColorStop(1, 'rgba(180,255,100,0)');
        c.fillStyle = g; c.fillRect(l.x - l.s * 6, l.y - l.s * 6, l.s * 12, l.s * 12);

    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.42)');
    c.fillStyle = g; c.fillRect(0, 0, W, H);

  function drawNotas(t, noche) {
    c.save(); c.globalAlpha = notasA;
    const fuente = px => `700 ${px}px Caveat, "Segoe Script", "Bradley Hand", cursive`;
    // cuerdas con lucecitas
    [0.19, 0.415].forEach((fy, fi) => {
      const yb = fy * H, desde = -0.2 * W + (pan % (pasoX * 2)), hasta = W + 0.2 * W;
      c.strokeStyle = 'rgba(70,45,25,.9)'; c.lineWidth = Math.max(1.2, H * 0.0025);
      c.beginPath();
      for (let x = desde - pasoX * 2; x <= hasta + pasoX * 2; x += 6) { const y = yTendedero(x - pan, yb); x === desde - pasoX * 2 ? c.moveTo(x, y) : c.lineTo(x, y); }
      c.stroke();
      // bombillas
      for (let x = desde - pasoX * 2; x <= hasta + pasoX * 2; x += pasoX / 3) {
        const y = yTendedero(x - pan, yb) + 4, i = Math.round((x - pan) / (pasoX / 3));
        const calido = i % 2 ? [255, 220, 130] : [255, 180, 110], b = 0.55 + 0.45 * Math.sin(t * 1.7 + i * 1.3);
        c.fillStyle = 'rgba(60,40,25,.9)'; c.fillRect(x - 1.5, y - 4, 3, 4);
        if (noche > 0.02) {
          c.globalCompositeOperation = 'lighter';
          const g = c.createRadialGradient(x, y + 4, 0, x, y + 4, 16); g.addColorStop(0, rgba(calido, 0.55 * noche * b)); g.addColorStop(1, rgba(calido, 0));
          c.fillStyle = g; c.fillRect(x - 16, y - 12, 32, 32); c.globalCompositeOperation = 'source-over';
        }
        c.fillStyle = noche > 0.02 ? rgba(calido, 0.4 + 0.6 * noche * b) : 'rgba(230,225,210,.8)';
        c.beginPath(); c.arc(x, y + 3, 2.6, 0, TAU); c.fill();
      }
    });
    // notitas
    for (const it of items) {
      const x = it.x + pan;
      const esT = it.tipo === 't', w = esT ? notaW * 1.18 : notaW, h = esT ? notaH * 1.18 : notaH;
      it.rect = null;
      if (x < -w || x > W + w) continue;
      const yl = yTendedero(it.x, it.yLinea), hilo = notaH * 0.28;
      const ang = it.rot + (reduce ? 0 : 0.03 * viento(t, it.x) + 0.02 * Math.sin(t * 1.1 + it.ph));
      c.save(); c.translate(x, yl); c.rotate(ang);
      // hilo y pinza
      c.strokeStyle = 'rgba(80,55,30,.9)'; c.lineWidth = 1.2; c.beginPath(); c.moveTo(0, 0); c.lineTo(0, hilo); c.stroke();
      // papel

      const g = c.createLinearGradient(0, hilo, 0, hilo + h); g.addColorStop(0, esT ? '#fff3cf' : '#fffaea'); g.addColorStop(1, esT ? '#f7dfa0' : '#fdefc9');
      c.fillStyle = g; c.beginPath(); c.roundRect(-w / 2, hilo, w, h, 4); c.fill();
      c.shadowColor = 'transparent';
      if (esT) { c.strokeStyle = 'rgba(201,138,26,.85)'; c.lineWidth = 1.5; c.beginPath(); c.roundRect(-w / 2 + 4, hilo + 4, w - 8, h - 8, 3); c.stroke(); }
      if (noche < 0.98) { c.fillStyle = `rgba(255,160,80,${(0.12 * (1 - noche)).toFixed(3)})`; c.beginPath(); c.roundRect(-w / 2, hilo, w, h, 4); c.fill(); }
      // pinza
      c.fillStyle = '#b07a48'; c.fillRect(-w * 0.045, hilo - h * 0.08, w * 0.09, h * 0.2);
      c.fillStyle = 'rgba(255,255,255,.25)'; c.fillRect(-w * 0.045, hilo - h * 0.08, w * 0.03, h * 0.2);
      // texto
      c.fillStyle = '#4a3210'; c.textAlign = 'center'; c.textBaseline = 'middle';
      if (esT) {
        const Tj = TARJETAS[it.idx];
        c.font = fuente(w * 0.17); c.fillText(Tj.titulo, 0, hilo + h * 0.58, w * 0.9);
        c.font = `600 ${Math.max(8, w * 0.075)}px Nunito, "Segoe UI", sans-serif`; c.fillStyle = 'rgba(120,80,20,.75)';
        c.fillText(leidos.has(it.id) ? 'LEÍDA ✓' : 'TOCA PARA ABRIR', 0, hilo + h * 0.85);
        miniFlor(0, hilo + h * 0.28, w * 0.11, Tj.ramo === 'tulipanes');
      } else {
        const px = w * 0.148; c.font = fuente(px);
        const lineas = envolver(FRASES[it.idx], w * 0.86), lh = px * 1.02, y0 = hilo + h / 2 - (lineas.length - 1) * lh / 2;
        lineas.forEach((l, i) => c.fillText(l, 0, y0 + i * lh, w * 0.9));
        if (leidos.has(it.id)) { c.fillStyle = '#e0a020'; c.beginPath(); c.arc(w / 2 - 9, hilo + h - 9, 4, 0, TAU); c.fill(); }
      }
      c.restore();
      // rect para el toque (sin rotar: basta)
      it.rect = { x: x - w / 2, y: yl + hilo, w, h };
    }
    c.restore();
  }
  function miniFlor(x, y, r, tulipan) {
    if (tulipan) {
      c.fillStyle = '#e8a41c'; c.beginPath(); c.moveTo(x - r * 0.6, y + r * 0.3); c.quadraticCurveTo(x - r * 0.7, y - r * 0.9, x - r * 0.25, y - r * 0.6);
      c.quadraticCurveTo(x, y - r * 1.05, x + r * 0.25, y - r * 0.6); c.quadraticCurveTo(x + r * 0.7, y - r * 0.9, x + r * 0.6, y + r * 0.3); c.quadraticCurveTo(x, y + r * 0.7, x - r * 0.6, y + r * 0.3); c.fill();
      c.strokeStyle = '#3f8a3a'; c.lineWidth = 2; c.beginPath(); c.moveTo(x, y + r * 0.5); c.lineTo(x, y + r * 1.5); c.stroke();
      return;
    }
    for (let i = 0; i < 12; i++) { c.save(); c.translate(x, y); c.rotate(i * TAU / 12); c.fillStyle = i % 2 ? '#f5c451' : '#e39a1c'; c.beginPath(); c.ellipse(r * 0.65, 0, r * 0.42, r * 0.17, 0, 0, TAU); c.fill(); c.restore(); }
    c.fillStyle = '#3d2108'; c.beginPath(); c.arc(x, y, r * 0.36, 0, TAU); c.fill();
  }
  function drawPetalos(t, dt) {
    for (const p of petalos) {
      p.y += p.vy * dt * H; p.x += (p.vx + Math.sin(t * 1.4 + p.ph) * 0.05) * dt * W; p.r += p.vr * dt;
      if (p.y > H + 20) { p.y = -20; p.x = Math.random() * W; }
      c.save(); c.translate(p.x, p.y); c.rotate(p.r); c.globalAlpha = p.a;
      const g = c.createLinearGradient(-p.s, 0, p.s, 0); g.addColorStop(0, '#f6b52a'); g.addColorStop(1, '#ffe27a');
      c.fillStyle = g; c.beginPath(); c.ellipse(0, 0, p.s, p.s * 0.42, 0, 0, TAU); c.fill(); c.restore();
    }
  }

  // ---------- bucle ----------
  function loop(now) {
    const t = (now - t0) / 1000, dt = Math.min(0.05, t - ultimo); ultimo = t;
    if (estado === 'ocaso') {
      T = smooth((t - tFase) / 7);
      if (t - tFase > 2.2) portada.classList.add('fuera');
      if (T >= 1) { T = 1; estado = 'noche'; tFase = t; portada.hidden = true; pista.classList.add('ver'); btnSeguir.hidden = false; setTimeout(() => pista.classList.remove('ver'), 9000); }
    } else if (estado === 'noche') {
      notasA = clamp((t - tFase) / 1.6);
    } else if (estado === 'alba') {
      const k = (t - tFase) / 9; T = 1 + smooth(k); notasA = clamp(1 - (t - tFase) / 1.5);
      if (T > 1.55 && !petalos.length) petalos = Array.from({ length: reduce ? 20 : 55 }, () => ({ x: Math.random() * W, y: Math.random() * H - H, vy: 0.06 + Math.random() * 0.08, vx: (Math.random() - 0.5) * 0.03, r: Math.random() * TAU, vr: (Math.random() - 0.5) * 2, s: 5 + Math.random() * 7, ph: Math.random() * TAU, a: 0.75 + Math.random() * 0.25 }));
      if (T > 1.78 && fin.hidden) { fin.hidden = false; requestAnimationFrame(() => fin.classList.add('ver')); }
      if (k >= 1) { T = 2; estado = 'fin'; }
    }
    draw(t, dt);
    requestAnimationFrame(loop);
  }

  // ---------- interacción ----------
  let pDown = null, arrastro = false, panIni = 0;
  cv.addEventListener('pointerdown', e => { pDown = { x: e.clientX, y: e.clientY }; arrastro = false; panIni = pan; try { cv.setPointerCapture(e.pointerId); } catch (x) {} });
  cv.addEventListener('pointermove', e => {
    if (!pDown || estado !== 'noche') return;
    const dx = e.clientX - pDown.x;
    if (Math.abs(dx) > 6) arrastro = true;
    if (arrastro) pan = Math.max(-panMax, Math.min(0, panIni + dx));
  });
  cv.addEventListener('pointerup', e => {
    if (!pDown) return;
    const p = pDown; pDown = null;
    if (arrastro) return;
    if (estado === 'portada') { empezar(); return; }
    if (estado !== 'noche') return;
    const it = items.find(it => it.rect && p.x >= it.rect.x && p.x <= it.rect.x + it.rect.w && p.y >= it.rect.y && p.y <= it.rect.y + it.rect.h);
    if (it) abrirItem(it);
  });
  cv.addEventListener('pointercancel', () => { pDown = null; });
  cv.addEventListener('wheel', e => { if (estado !== 'noche') return; e.preventDefault(); pan = Math.max(-panMax, Math.min(0, pan - (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY))); }, { passive: false });
  portada.addEventListener('click', () => { if (estado === 'portada') empezar(); });

  function empezar() {
    estado = 'ocaso'; tFase = (performance.now() - t0) / 1000;
    activarAudio();
  }
  function abrirItem(it) {
    if (it.tipo === 'f') {
      $('#notaTxt').textContent = FRASES[it.idx].replace('|', ' ');
      nota.hidden = false; requestAnimationFrame(() => requestAnimationFrame(() => nota.classList.add('abierta')));
      leidos.add(it.id); revisarProgreso();
    } else abrirTarjeta(it.idx);
  }
  nota.addEventListener('click', () => { nota.classList.remove('abierta'); setTimeout(() => { nota.hidden = true; }, 350); });
  let tarjetaIdx = -1;
  function abrirTarjeta(i) {
    tarjetaIdx = i;
    const Tj = TARJETAS[i];
    $('#ramo').innerHTML = Tj.ramo === 'girasoles' ? ramoGirasoles() : ramoTulipanes();
    $('#tituloTarjeta').textContent = Tj.titulo; $('#textoTarjeta').textContent = Tj.texto;
    $('#pasoTarjeta').textContent = `${i + 1} de ${TARJETAS.length}`;
    $('#cerrar').textContent = 'Cerrar';
    tarjeta.hidden = false; requestAnimationFrame(() => requestAnimationFrame(() => tarjeta.classList.add('abierta')));
    leidos.add('t' + i); revisarProgreso();
  }
  $('#cerrar').addEventListener('click', () => { tarjeta.classList.remove('abierta'); setTimeout(() => { tarjeta.hidden = true; }, 420); });
  function revisarProgreso() {
    const t = leidos.has('t0') && leidos.has('t1'), f = FRASES.every((_, i) => leidos.has('f' + i));
    if (t || f) btnSeguir.classList.add('ver');
  }
  btnSeguir.addEventListener('click', () => { if (estado !== 'noche') return; estado = 'alba'; tFase = (performance.now() - t0) / 1000; btnSeguir.classList.remove('ver'); pista.classList.remove('ver'); setTimeout(() => { btnSeguir.hidden = true; }, 1000); });
  $('#otraVez').addEventListener('click', reiniciar);
  function reiniciar() {
    fin.classList.remove('ver'); setTimeout(() => { fin.hidden = true; }, 1200);
    estado = 'portada'; T = 0; pan = 0; notasA = 0; leidos.clear(); petalos = [];
    portada.hidden = false; portada.classList.remove('fuera'); btnSeguir.hidden = true; btnSeguir.classList.remove('ver');
    escena.scrollTop = 0;
  }

  // ---------- ramos en SVG para las tarjetas ----------
  const DEFS = '<defs><linearGradient id="pet" x1="0" x2="1"><stop offset="0" stop-color="#e39a1c"/><stop offset="1" stop-color="#ffd85a"/></linearGradient><linearGradient id="pet2" x1="0" x2="1"><stop offset="0" stop-color="#c8801a"/><stop offset="1" stop-color="#f3bf3a"/></linearGradient><radialGradient id="cen"><stop offset="0" stop-color="#6b3d14"/><stop offset="0.75" stop-color="#3b2008"/><stop offset="1" stop-color="#241204"/></radialGradient><linearGradient id="tul" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe266"/><stop offset="1" stop-color="#e29b16"/></linearGradient></defs>';
  const f1 = n => n.toFixed(1);
  function svgGirasol(cx, cy, r) {
    let s = '';
    for (let i = 0; i < 14; i++) s += `<g transform="translate(${cx} ${cy}) rotate(${f1((i + 0.5) * 360 / 14)})"><ellipse cx="${f1(r * 0.5)}" cy="0" rx="${f1(r * 0.36)}" ry="${f1(r * 0.13)}" fill="url(#pet2)"/></g>`;
    for (let i = 0; i < 14; i++) s += `<g transform="translate(${cx} ${cy}) rotate(${f1(i * 360 / 14)})"><ellipse cx="${f1(r * 0.62)}" cy="0" rx="${f1(r * 0.42)}" ry="${f1(r * 0.15)}" fill="url(#pet)"/></g>`;
    s += `<circle cx="${cx}" cy="${cy}" r="${f1(r * 0.34)}" fill="url(#cen)"/>`;
    for (let i = 0; i < 40; i++) { const a = i * 2.39996, rr = r * 0.31 * Math.sqrt(i / 40); s += `<circle cx="${f1(cx + rr * Math.cos(a))}" cy="${f1(cy + rr * Math.sin(a))}" r="${f1(r * 0.03)}" fill="rgba(255,200,90,0.35)"/>`; }
    return s;
  }
  const tallo = (x1, y1, x2, y2) => `<path d="M${x1} ${y1} Q${f1((x1 + x2) / 2 + (x2 - x1) * 0.1)} ${f1((y1 + y2) / 2 + 8)} ${x2} ${y2}" stroke="#2f6b2f" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  const hojaSvg = (x, y, rot, l) => `<ellipse cx="${x}" cy="${y}" rx="${l}" ry="${f1(l * 0.42)}" transform="rotate(${rot} ${x} ${y})" fill="#3f8a3a"/>`;
  const lazo = (x, y) => `<g><ellipse cx="${x - 16}" cy="${y - 4}" rx="15" ry="8" transform="rotate(-25 ${x - 16} ${y - 4})" fill="#e0a93a"/><ellipse cx="${x + 16}" cy="${y - 4}" rx="15" ry="8" transform="rotate(25 ${x + 16} ${y - 4})" fill="#e0a93a"/><path d="M${x} ${y} l-10 26 M${x} ${y} l12 24" stroke="#d29a2c" stroke-width="5" stroke-linecap="round" fill="none"/><circle cx="${x}" cy="${y}" r="6" fill="#c98a1a"/></g>`;
  function svgTulipan(cx, cy, s) {
    const p = `M${f1(cx - 0.5 * s)} ${cy} Q${f1(cx - 0.6 * s)} ${f1(cy - 0.9 * s)} ${f1(cx - 0.25 * s)} ${f1(cy - 0.75 * s)} Q${cx} ${f1(cy - 1.1 * s)} ${f1(cx + 0.25 * s)} ${f1(cy - 0.75 * s)} Q${f1(cx + 0.6 * s)} ${f1(cy - 0.9 * s)} ${f1(cx + 0.5 * s)} ${cy} Q${cx} ${f1(cy + 0.4 * s)} ${f1(cx - 0.5 * s)} ${cy} Z`;
    const q = `M${f1(cx - 0.2 * s)} ${f1(cy + 0.05 * s)} Q${f1(cx - 0.15 * s)} ${f1(cy - 0.6 * s)} ${cx} ${f1(cy - 0.85 * s)} Q${f1(cx + 0.15 * s)} ${f1(cy - 0.6 * s)} ${f1(cx + 0.2 * s)} ${f1(cy + 0.05 * s)} Z`;
    return `<path d="${p}" fill="url(#tul)"/><path d="${q}" fill="rgba(255,240,170,0.45)"/>`;
  }
  function ramoGirasoles() {
    let s = DEFS + tallo(64, 84, 100, 205) + tallo(108, 60, 100, 205) + tallo(146, 96, 100, 205);
    s += hojaSvg(78, 150, -40, 20) + hojaSvg(126, 160, 35, 18);
    s += svgGirasol(64, 84, 34) + svgGirasol(146, 96, 32) + svgGirasol(108, 60, 38) + lazo(100, 200);
    return `<svg viewBox="0 0 200 240" role="img" aria-label="Ramo de girasoles">${s}</svg>`;
  }
  function ramoTulipanes() {
    const fl = [[52, 92, 22], [76, 66, 24], [102, 52, 26], [128, 66, 24], [150, 92, 22]];
    let s = DEFS;
    for (const [x, y] of fl) s += tallo(x, y, 100, 205);
    s += hojaSvg(70, 150, -55, 26) + hojaSvg(132, 156, 50, 26) + hojaSvg(100, 172, -80, 22);
    for (const [x, y, r] of fl) s += svgTulipan(x, y, r);
    s += lazo(100, 200);
    return `<svg viewBox="0 0 200 240" role="img" aria-label="Ramo de tulipanes">${s}</svg>`;
  }

  // ---------- audio ----------
  const hayCancion = !!cancion.getAttribute('src');
  (function aBlob(el) {
    const src = el.getAttribute('src'); if (!src || src.slice(0, 5) !== 'data:') return;
    try {
      const coma = src.indexOf(','), mime = src.slice(5, src.indexOf(';')), bin = atob(src.slice(coma + 1));
      const buf = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
      el.src = URL.createObjectURL(new Blob([buf], { type: mime }));
    } catch (e) {}
  })(cancion);
  let audioOn = true;
  function activarAudio() {
    if (!hayCancion) return;
    cancion.volume = 0.85;
    cancion.play().then(() => { sonidoBtn.hidden = false; }).catch(() => {});
  }
  sonidoBtn.addEventListener('click', () => {
    audioOn = !audioOn; cancion.muted = !audioOn;
    sonidoBtn.setAttribute('aria-pressed', audioOn); sonidoBtn.setAttribute('aria-label', audioOn ? 'Sonido activado' : 'Sonido silenciado');
  });

  // ---------- tamaño ----------
  function resize() {
    W = escena.clientWidth; H = escena.clientHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); cv.style.width = W + 'px'; cv.style.height = H + 'px';
    c = cv.getContext('2d'); c.setTransform(DPR, 0, 0, DPR, 0, 0);
    initNotas(); initCampo(); initParticulas();
    pan = Math.max(-panMax, Math.min(0, pan));
  }
  addEventListener('resize', resize);
  escena.addEventListener('scroll', () => { escena.scrollTop = 0; escena.scrollLeft = 0; });
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
